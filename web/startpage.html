          <div class="tab2">

            <div class="content-pane"  style="font-size:90%">
              <h3>Usage</h3>
              <ol>
                <li>Select the boat <b>polars</b>, the <b>forecast model</b> and, if wanted, <b>currents</b> and <b>waves</b>.</li>
                <li>
                  Set start and destination by dragging the <img src="img/start_32x20.png" alt="start flag"> start and
                  <img src="img/finish_32x20.png" alt="finish flag"> finish flags,
                  or right-click on the map and choose 'Set start' / 'Set destination'.<br>
                  The start can also be typed into the 'Start position' field (press 'Set') or taken from NMEA, see below.
                </li>
                <li>
                  Optionally add <b>intermediate waypoints or gates</b>, see 'Multi-route' below.
                </li>
                <li>
                  Tick 'Start time' to specify a start time (UTC), or leave it unchecked to use the current time.
                </li>
                <li>
                  Select the maximum <b>duration</b> (up to 15 days).
                  <p>
                    Long routings may take several minutes. <em><b>Please avoid frequent long routings.</b></em><br>
                    Calculation time also depends on the number of gates and nearby coastlines.
                  </p>
                </li>
                <li>Press 'Execute'. The route, isochrones and (optionally) alternative tracks are drawn on the map.</li>
              </ol>

              <h3>Multi-route (intermediate waypoints and gates)</h3>
              <ul>
                <li>
                  Right-click on the map and choose 'Add waypoint' or 'Add gate'. Waypoints and gates are visited in the order you add them,
                  before the destination. The red line shows the planned order.
                </li>
                <li>Drag a waypoint or gate endpoint to move it. Double-click a marker to remove it. 'Clear waypoints' in the right-click menu removes all waypoints and gates.</li>
                <li>
                  <b>Gates:</b> choose 'Add gate' in the right-click menu (first endpoint), then click the map for the second endpoint.
                  The route must cross the orange gate line, at <em>any</em> point between the endpoints; it continues from the crossing point.
                  The router explores different crossing positions and times to find a good continuation through the following gates.
                  Gates can only be intermediate targets, not the destination. Gate endpoints may be placed on land,
                  but the route must cross through navigable water.
                </li>
                <li>
                  <b>Use no more than four gates per route.</b> Additional gates increase calculation time and memory use,
                  especially near coastlines. This is a performance recommendation, not a hard limit.
                </li>
                <li>
                  Point waypoints are hit exactly, with a final approach that may include a tack or gybe.
                  The arrival time is the start time of the next leg. A gate only needs to be crossed between its endpoints.
                </li>
                <li>
                  If the approach is not possible (e.g. the path crosses land) or the duration runs out, routing stops
                  at the last isochrone reached. Waypoints on land are rejected.
                </li>
                <li>Currents and waves are not considered on the final approach to a waypoint. Manually added waypoints and gates are lost on reload.</li>
              </ul>

              <h3>Races and GPX import</h3>
              <ul>
                <li>'Import' loads a fairwinds.world race course (GPX). Start and destination are set to the gate midpoints and the course is drawn on the map.</li>
                <li>Imported races are stored in your browser and can be selected from the 'Races' list. 'Remove' deletes the selected race (or all races if none is selected).</li>
              </ul>

              <h3>NMEA</h3>
              <ol>
                <li>
                  Enter the NMEA host and port
                </li>
                <li>
                  Press 'Update' to acquire your boat position.
                  <p>
                    A popup is shown if a GPRMC message was successfully received. Click 'ok'.
                    The start flag will be moved to your boat position and the start time is set to the timestamp of the NMEA message.<br>
                    Observe the timestamp. <b>You may need to press 'Update' repeatedly</b> to receive the latest message.
                  </p>
                </li>
              </ol>

              <h3>Wind display and forecast slider</h3>
              <ul>
                <li>'Display wind' shows the wind field for the forecast hour selected with the slider (or the &lt;6, &lt;1, 1&gt;, 6&gt; buttons). The forecast cycle is shown next to it.</li>
                <li>The status line shows wind, VMG angles, distance and bearing to the finish for the point under the cursor.</li>
                <li>'Display tracks' additionally draws alternative paths from the isochrones.</li>
              </ul>

              <h3>TWA tool</h3>
              <ul>
                <li>
                  <p>
                    When routing is complete and the route is displayed, click on any route point to anchor the TWA tool on it.<br>
                    Click on the map to set a direction. The blue path represents a fixed heading.
                  </p>
                  <p style="font-size:80%">
                    During wind updates the TWA tool may attempt to use a forecast that is not yet available.
                    In this case, retry later or select an earlier time using the forecast slider.
                  </p>
                </li>
              </ul>

              <h3>Isochrones and route points</h3>
              <ul>
                <li>
                  Clicking on an isochrone highlights it and sets the wind display to the corresponding time.
                  Clicking on a route point does the same and shows details (time, heading, TWA, speed, sail, wind, current).
                </li>
                <li>
                  On routes with gates, solid, dashed and dotted isochrones distinguish gate-progress stages.
                  Hover over a fragment to see its UTC time and the number of gates crossed in that group.
                  Clicking a fragment highlights its stage at that time. Several fragments can belong to the same stage and time.
                </li>
                <li>
                  <b style="color:red">Red</b> isochrones signal that the previous cycle was used - either because the current cycle is only used later, or because the forecast was not yet available.
                </li>
              </ul>

              <h3>Downloading route information</h3>
              Select the format (GPX or CSV) and press 'Download' to save the route, or download the schedule.

          <!-- Tab visibility stays controlled by the existing radio-button CSS. -->
          <div class="tab6">
            <div class="status-toolbar">
              <div><h2>Server status</h2><span id="status-updated" aria-live="polite">Loading…</span></div>
              <button id="status-refresh" type="button">Refresh</button>
            </div>
            <p id="status-error" role="alert" hidden></p>
            <div class="status-cards">
              <section class="status-card">
                <h3>Activity</h3>
                <dl><dt>Server started</dt><dd id="tb_serverstart">—</dd>
                  <dt>Requests in the last 10 minutes</dt><dd id="tb_requests">—</dd></dl>
              </section>
              <section class="status-card">
                <h3>Lisp heap</h3>
                <p id="status-heap" class="status-metric">—</p>
                <progress id="status-heap-bar" max="100" value="0" aria-label="Lisp heap usage"></progress>
                <p class="status-note">Current allocation / configured limit. May include reclaimable garbage; refreshing does not force GC. Native memory is excluded.</p>
              </section>
              <section class="status-card">
                <h3>Caches</h3>
                <dl><dt>Decoded forecast arrays</dt><dd id="status-forecast-bytes">—</dd>
                  <dt>Forecast entries</dt><dd id="tb_fc_cache">—</dd>
                  <dt>Raw / combined polars</dt><dd id="status-polars-cache">—</dd>
                  <dt>Race records</dt><dd id="status-races-cache">—</dd></dl>
                <p class="status-note">Forecast bytes count unique decoded arrays, excluding object headers and cache metadata. This is part of the Lisp heap.</p>
              </section>
            </div>
            <section class="status-section">
              <h3>Forecast cache by cycle</h3>
              <div class="status-table-wrap"><table id="status-cache-groups"><thead><tr><th>Source</th><th>Cycle (UTC)</th><th>Resolution</th><th>Entries</th><th>Decoded memory</th></tr></thead><tbody></tbody></table></div>
            </section>
            <section class="status-section">
              <h3>Forecast downloads</h3>
              <div class="status-table-wrap"><table id="tb_downloads"><thead><tr><th>Source</th><th>Completed cycle (UTC)</th><th>In progress</th></tr></thead><tbody></tbody></table></div>
            </section>
            <section class="status-section">
              <h3>Last routing</h3>
              <dl id="status-last-route" class="status-details"><dt>No routing completed yet</dt><dd>—</dd></dl>
            </section>
            <section class="status-section">
              <h3>Server configuration</h3>
              <p class="status-note">Current values in the running image, including configuration overrides. Route-specific choices are supplied by each routing request.</p>
              <div class="status-table-wrap"><table id="status-parameters"><thead><tr><th>Group</th><th>Parameter</th><th>Current value</th></tr></thead><tbody></tbody></table></div>
            </section>
          </div>

        </figure>
