          <div class="tab2">

            <div class="content-pane"  style="font-size:90%">
              <h3>Plan a route</h3>
              <ol>
                <li>Drag the start and finish flags, or right-click the map to set either position. To use your boat’s NMEA position and time, enter the host and port, click <b>Update</b> and check the timestamp.</li>
                <li>Choose <b>Polars</b>, <b>Model</b> and <b>Duration</b> (12 hours to 12 days). Set currents and waves as needed. Leave <b>Start time</b> unchecked to depart now, or enter a UTC departure.</li>
                <li>For two forecast models, set <b>Switch after</b> to 6, 12 or 24 hours from departure and choose the second model under <b>Then</b>. Leave it <b>Off</b> for one model.</li>
                <li>Click <b>Execute</b>. Enable <b>Display tracks</b> for alternative paths.</li>
              </ol>

              <p><b>Route fine-tuning:</b> After routing, the optimizer tries whole-degree TWA and fixed-heading segments to reduce unnecessary commands. Heading segments are checked against changing wind every minute. Tack and gybe order is preserved, and the final ETA cannot increase. Duration-limited routes instead seek greater distance from the start at the same final time. If no valid improvement is found, the original route is retained. Check <b>Fine-tuning</b> below the route statistics and hover over the result for details.</p>

              <h3>Waypoints, gates and races</h3>
              <ul>
                <li>Right-click and choose <b>Add waypoint</b> or <b>Add gate</b>. For a gate, click its second endpoint. The route visits targets in order. Use at most four gates for performance.</li>
                <li>Drag a marker to move it, double-click to remove its waypoint or gate, or choose <b>Clear waypoints</b> to remove all targets.</li>
                <li>Use <b>Import</b> to load a FairWinds GPX course or <b>Races</b> to restore a race saved in this browser.</li>
              </ul>

              <h3>Inspect the forecast</h3>
              <ul>
                <li>Enable <b>Display wind</b>. The footer shows the forecast model, cycle and sample time (UTC).</li>
                <li>Click an isochrone or route point to enter <b>Recorded model</b> mode (red). Use the time slider or step buttons to follow the highlighted isochrone’s recorded model and cycle.</li>
                <li>Select a <b>Model</b> to leave replay. Once it loads, the highlight clears and the footer shows <b>Displayed model</b> (yellow). The time controls now browse that forecast.</li>
                <li>For a TWA or heading projection, click a route point, then a point on the map.</li>
              </ul>

              <p>Under <b>Route</b>, choose GPX or CSV and click <b>Download</b>. Under <b>Schedule</b>, download the sailing schedule as CSV.</p>

          <!-- Tab visibility stays controlled by the existing radio-button CSS. -->
          <div class="tab6">
            <div class="status-toolbar">
              <div><h2>Server status</h2><span id="status-updated" aria-live="polite">Loading…</span></div>
              <button id="status-refresh" type="button">Refresh</button>
            </div>
            <p id="status-error" role="alert" hidden></p>
            <div class="status-cards">
              <section class="status-card">
                <h3>Activity</h3>
                <dl><dt>Server started</dt><dd id="tb_serverstart">—</dd>
                  <dt>Requests in the last 10 minutes</dt><dd id="tb_requests">—</dd></dl>
              </section>
              <section class="status-card">
                <h3>Lisp heap</h3>
                <p id="status-heap" class="status-metric">—</p>
                <progress id="status-heap-bar" max="100" value="0" aria-label="Lisp heap usage"></progress>
                <p class="status-note">Current allocation / configured limit. May include reclaimable garbage; refreshing does not force GC. Native memory is excluded.</p>
              </section>
              <section class="status-card">
                <h3>Caches</h3>
                <dl><dt>Decoded forecast arrays</dt><dd id="status-forecast-bytes">—</dd>
                  <dt>Forecast entries</dt><dd id="tb_fc_cache">—</dd>
                  <dt>Raw / combined polars</dt><dd id="status-polars-cache">—</dd>
                  <dt>Race records</dt><dd id="status-races-cache">—</dd></dl>
                <p class="status-note">Forecast bytes count unique decoded arrays, excluding object headers and cache metadata. This is part of the Lisp heap.</p>
              </section>
            </div>
            <section class="status-section">
              <h3>Forecast cache by cycle</h3>
              <div class="status-table-wrap"><table id="status-cache-groups"><thead><tr><th>Source</th><th>Cycle (UTC)</th><th>Resolution</th><th>Entries</th><th>Decoded memory</th></tr></thead><tbody></tbody></table></div>
            </section>
            <section class="status-section">
              <h3>Forecast downloads</h3>
              <div class="status-table-wrap"><table id="tb_downloads"><thead><tr><th>Source</th><th>Completed cycle (UTC)</th><th>In progress</th></tr></thead><tbody></tbody></table></div>
            </section>
            <section class="status-section">
              <h3>Last routing</h3>
              <dl id="status-last-route" class="status-details"><dt>No routing completed yet</dt><dd>—</dd></dl>
            </section>
            <section class="status-section">
              <h3>Server configuration</h3>
              <p class="status-note">Current values in the running image, including configuration overrides. Route-specific choices are supplied by each routing request.</p>
              <div class="status-table-wrap"><table id="status-parameters"><thead><tr><th>Group</th><th>Parameter</th><th>Current value</th></tr></thead><tbody></tbody></table></div>
            </section>
